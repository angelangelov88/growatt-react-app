name: CI

# Checks every PR into main (again on each push to it), and once a week for
# database changes made outside the migrations. Merging to main deploys to
# production, so this runs before the merge, not after. This repo is public,
# and so are these logs: the steps print names and counts, never secret values.
# Actions are pinned to commits, so a moved tag can't change what runs here.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 6am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: npx tsc --noEmit -p . && npx tsc --noEmit -p scripts && npx tsc --noEmit -p api
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: No secrets or server code in the bundle
        run: pnpm check:bundle
      # Dependency updates and advisories are checked by hand (CLAUDE.md).

  database:
    # PRs from forks don't get the secrets.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Database only reachable through our API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # ci_check: can read Postgres's catalog, nothing else.
          CI_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: pnpm check:database
