name: Update Growatt Charge Times

# Asks the app to apply Octopus slots for every user with automatic charging on.
# The work runs in /api/cron/update; this only holds the schedule and the secret.

on:
  schedule:
    - cron: "0 19-23 * * *" # every hour 7pm-11pm UTC (8pm-midnight GMT / BST)
    - cron: "0 0-3 * * *" # every hour midnight-3am UTC
    - cron: "0,30 4-10 * * *" # every 30 mins 4am-10am UTC (5am-11am GMT / BST)
    - cron: "0 11 * * *" # once at 11am UTC
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run automatic charging
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # The header goes in on stdin, so the secret isn't on the command line.
        # The reply is counts only (this repo's logs are public).
        run: |
          printf 'Authorization: Bearer %s' "$CRON_SECRET" |
            curl --fail-with-body --silent --show-error --max-time 90 \
              --header @- https://kelpwatt.angelov.uk/api/cron/update
