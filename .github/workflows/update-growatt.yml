name: Update Growatt Charge Times

# Manual backup only: runs one automatic charging check for every user with it
# on. The real schedule is Supabase pg_cron, every 5 minutes, one request per
# user (supabase/migrations/0007_automation.sql). The work runs in
# /api/cron/update; this only holds the secret.

on:
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run automatic charging
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # The header goes in on stdin, so the secret isn't on the command line.
        # The reply is counts only (this repo's logs are public).
        run: |
          printf 'Authorization: Bearer %s' "$CRON_SECRET" |
            curl --fail-with-body --silent --show-error --max-time 90 \
              --header @- https://kelpwatt.angelov.uk/api/cron/update
