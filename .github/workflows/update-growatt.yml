name: Update Growatt Charge Times

on:
  schedule:
    - cron: '0 19-23 * * *'      # every hour 7pm-11pm UTC (8pm-midnight GMT / BST)
    - cron: '0 0-3 * * *'        # every hour midnight-3am UTC
    - cron: '0,30 4-10 * * *'    # every 30 mins 4am-10am UTC (5am-11am GMT / BST)
    - cron: '0 11 * * *'         # once at 11am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install spark-md5

      - name: Run update script
        env:
          GROWATT_USER: ${{ secrets.GROWATT_USER }}
          GROWATT_PASSWORD: ${{ secrets.GROWATT_PASSWORD }}
          GROWATT_SERIAL: ${{ secrets.GROWATT_SERIAL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_ACCOUNT: ${{ secrets.OCTOPUS_ACCOUNT }}
        run: node scripts/update-growatt.mjs
